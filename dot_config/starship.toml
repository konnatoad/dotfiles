###############################################################################
# GLOBAL LAYOUT: arrow → dir → git branch → git status
###############################################################################
add_newline = false
scan_timeout = 200   # ms; custom.git_dirty scans cwd, ~ has an sshfs mount that can be slow
format = """$character$directory$git_branch${custom.git_dirty}"""

###############################################################################
# 1)  ARROW  (green = last cmd OK, red = last cmd failed)
###############################################################################
[character]
success_symbol = "[󰁕](green) "
error_symbol   = "[󰁕](red) "   # keep two spaces so alignment matches success

###############################################################################
# 2)  DIRECTORY  (cyan)
###############################################################################
[directory]
format = "[$path](cyan) "        # trailing space after the directory name
truncation_length = 1            # show repo name only (no long paths)
truncate_to_repo  = false

###############################################################################
# 3)  GIT BRANCH  →  git:(master)
#       • “git:” stays default colour
#       • branch name in red
#       • parentheses default colour
###############################################################################
[git_branch]
format = "git:([\\($branch\\)](red)) "
style  = ""                      # prevent Starship from recolouring the whole bit

###############################################################################
# 4)  GIT DIRTY  →  one ✘ no matter how many kinds of changes there are
#       (git_status's $all_status prints one symbol per kind, e.g. ✘ ✘)
#       dirty = uncommitted/untracked changes, stash, or ahead/behind upstream
###############################################################################
[custom.git_dirty]
when = """
git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1
[ -n "$(git status --porcelain 2>/dev/null | head -n1)" ] && exit 0
git rev-parse -q --verify refs/stash >/dev/null && exit 0
[ -n "$(git rev-list '@{u}...HEAD' 2>/dev/null | head -n1)" ] && exit 0
exit 1
"""
command = "echo ✘"
format  = "[$output]($style) "
style   = "yellow"
shell   = ["bash", "--noprofile", "--norc"]
